<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">

<title>EBN Geography | China — Week 3 | 3D</title>
<style>/* EBN Geography · classroom presentation styles, in the EBN Academy 2
   Geography worksheet house style (Blue / White / Yellow / Pink stages).
   Sized in viewport-height units so the interface reads the same at
   1366x768, 1920x1080 and 4K. Aptos (Office) with system fallbacks: works offline. */
:root {
  --u: clamp(7px, 1vh, 22px);
  --font: "Aptos", "Segoe UI", "Segoe UI Variable", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --navy: #0d2340;
  --ink: #f4f7fb;
  --ink-dim: #b8c4d3;
  --panel: rgba(9, 18, 30, 0.78);
  --panel-solid: #0c1726;
  --line: rgba(255, 255, 255, 0.14);
  --accent: #1A66C9;
  --water: #3fd0f2;
  --pump: #ffb020;
  --warn: #ff4b3e;
  --green: #66d36e;
  --radius: calc(var(--u) * 1.2);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1420; color: var(--ink); font-family: var(--font); }
body { -webkit-font-smoothing: antialiased; user-select: none; }
button { font-family: inherit; }
.ebn-app { position: fixed; inset: 0; }
.viewport { position: absolute; inset: 0; }
.gl-canvas { display: block; width: 100%; height: 100%; outline: none; cursor: grab; touch-action: none; }
.gl-canvas:active { cursor: grabbing; }
.vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 55%, rgba(0,0,0,0) 58%, rgba(5,10,18,0.38) 100%); }
.overlay { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

/* ---------- top bar ---------- */
.topbar { position: absolute; left: 0; right: 0; top: 0; height: calc(var(--u) * 6.4); display: flex; align-items: center; gap: calc(var(--u) * 2);
  padding: 0 calc(var(--u) * 2.4); background: linear-gradient(180deg, rgba(6, 14, 26, 0.86), rgba(6, 14, 26, 0.55)); border-bottom: 1px solid var(--line); z-index: 5; }
.brand { display: flex; align-items: baseline; gap: calc(var(--u) * 1.1); font-weight: 800; letter-spacing: 0.06em; font-size: calc(var(--u) * 2.2); white-space: nowrap; }
.brand-ebn { color: #fff; }
.brand-sep { color: var(--accent); font-weight: 400; }
.brand-week { color: var(--ink-dim); font-weight: 700; }
.scene-tabs { display: flex; gap: calc(var(--u) * 0.8); margin-left: auto; margin-right: auto; }
.tab { display: flex; align-items: center; gap: calc(var(--u) * 0.9); border: 1px solid var(--line); background: rgba(255,255,255,0.05); color: var(--ink-dim);
  font-weight: 800; letter-spacing: 0.08em; font-size: calc(var(--u) * 1.9); padding: calc(var(--u) * 0.8) calc(var(--u) * 2.2); border-radius: 999px; cursor: pointer; transition: all .2s; }
.tab:hover { color: #fff; background: rgba(255,255,255,0.1); }
.tab.active { color: #08162a; background: #fff; border-color: #fff; }
.tab-num { display: inline-grid; place-items: center; width: calc(var(--u) * 2.5); height: calc(var(--u) * 2.5); border-radius: 50%; font-size: calc(var(--u) * 1.4);
  background: rgba(255,255,255,0.12); }
.tab.active .tab-num { background: var(--navy); color: #fff; }
.top-actions { display: flex; gap: calc(var(--u) * 0.8); }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: calc(var(--u) * 0.7); height: calc(var(--u) * 4.6); min-width: calc(var(--u) * 4.6);
  padding: 0 calc(var(--u) * 1.6); border-radius: calc(var(--u) * 0.9); border: 1px solid var(--line); background: rgba(255,255,255,0.08); color: #fff;
  font-weight: 700; font-size: calc(var(--u) * 1.75); letter-spacing: 0.02em; cursor: pointer; transition: background .15s, border-color .15s, transform .1s; white-space: nowrap; }
.btn:hover { background: rgba(255,255,255,0.16); border-color: rgba(255,255,255,0.3); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: #fff; color: #08162a; border-color: #fff; min-width: calc(var(--u) * 12); }
.btn.primary:hover { background: #e4ecf6; }
.btn.ghost { background: transparent; }
.btn.on { background: rgba(74,163,255,0.28); border-color: var(--accent); }
.btn .ico { font-size: 1.15em; line-height: 1; }
kbd { font-family: inherit; font-size: 0.7em; font-weight: 700; opacity: 0.6; border: 1px solid currentColor; border-radius: 4px; padding: 0 0.35em; margin-left: 0.2em; }
.btn.primary kbd { opacity: 0.5; }

/* ---------- caption (teaching text) ---------- */
.caption { position: absolute; left: calc(var(--u) * 2.4); top: calc(var(--u) * 8.4); max-width: min(46vw, calc(var(--u) * 78)); padding: calc(var(--u) * 2) calc(var(--u) * 2.6) calc(var(--u) * 2.2);
  background: var(--panel); border: 1px solid var(--line); border-left: calc(var(--u) * 0.6) solid var(--accent); border-radius: var(--radius); z-index: 4;
  transition: opacity .18s ease, transform .18s ease; backdrop-filter: blur(6px); box-shadow: 0 10px 30px rgba(0,0,0,0.25); }
.caption.fading { opacity: 0; transform: translateY(-4px); }
.caption[data-tone="water"] { border-left-color: var(--water); }
.caption[data-tone="pump"] { border-left-color: var(--pump); }
.caption[data-tone="warn"] { border-left-color: var(--warn); }
.caption[data-tone="green"] { border-left-color: var(--green); }
.cap-kicker { font-size: calc(var(--u) * 1.55); font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: calc(var(--u) * 0.6); }
.cap-title { margin: 0; font-size: calc(var(--u) * 4.4); line-height: 1.05; font-weight: 900; letter-spacing: 0.01em; color: #fff; text-transform: uppercase; }
.caption[data-tone="warn"] .cap-title { color: #ff6a5e; }
.caption[data-tone="pump"] .cap-title { color: #ffc24d; }
.caption[data-tone="water"] .cap-title { color: #7fe3fb; }
.caption[data-tone="green"] .cap-title { color: #8fe596; }
.cap-body { margin: calc(var(--u) * 1.1) 0 0; font-size: calc(var(--u) * 2.5); line-height: 1.3; font-weight: 600; color: #eef3f9; }
.cap-words { display: flex; flex-wrap: wrap; gap: calc(var(--u) * 0.8); margin-top: calc(var(--u) * 1.4); }
.cap-words:empty { display: none; }
.word { display: flex; align-items: baseline; gap: calc(var(--u) * 0.8); padding: calc(var(--u) * 0.55) calc(var(--u) * 1.1); border-radius: calc(var(--u) * 0.7);
  background: rgba(255,255,255,0.08); border: 1px solid var(--line); font-size: calc(var(--u) * 1.65); }
.word-term { font-weight: 800; color: #fff; }
.word-def { color: var(--ink-dim); font-weight: 600; }

/* ---------- cause → effect chain (top right) ---------- */
.chain-host { position: absolute; right: calc(var(--u) * 2.4); top: calc(var(--u) * 8.4); z-index: 4; display: flex; flex-direction: column; align-items: flex-end; gap: calc(var(--u) * 1); }
.chain { display: flex; flex-direction: column; gap: calc(var(--u) * 0.5); padding: calc(var(--u) * 1.4); background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); backdrop-filter: blur(6px); }
.chain-title { font-size: calc(var(--u) * 1.45); font-weight: 800; letter-spacing: 0.14em; color: var(--ink-dim); text-transform: uppercase; margin-bottom: calc(var(--u) * 0.3); }
.chain-step { display: flex; align-items: center; gap: calc(var(--u) * 0.9); font-size: calc(var(--u) * 1.95); font-weight: 800; color: rgba(255,255,255,0.32); transition: color .4s; }
.chain-step .dot { width: calc(var(--u) * 1.3); height: calc(var(--u) * 1.3); border-radius: 50%; border: 2px solid currentColor; transition: background .4s; flex: none; }
.chain-step.lit { color: #fff; }
.chain-step.lit .dot { background: var(--accent); border-color: var(--accent); }
.chain-step.now { color: #ffd166; }
.chain-step.now .dot { background: #ffd166; border-color: #ffd166; box-shadow: 0 0 0 4px rgba(255,209,102,0.25); }
.chain-arrow { margin-left: calc(var(--u) * 0.35); font-size: calc(var(--u) * 1.3); color: rgba(255,255,255,0.3); line-height: 0.9; }

/* ---------- side panel ---------- */
.panel-host { position: absolute; right: calc(var(--u) * 2.4); bottom: calc(var(--u) * 20.5); z-index: 4; display: flex; flex-direction: column; gap: calc(var(--u) * 1); align-items: flex-end; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: calc(var(--u) * 1.5) calc(var(--u) * 1.8); backdrop-filter: blur(6px); min-width: calc(var(--u) * 34); }
.panel-title { font-size: calc(var(--u) * 1.45); font-weight: 800; letter-spacing: 0.14em; color: var(--ink-dim); text-transform: uppercase; margin-bottom: calc(var(--u) * 0.9); }
.panel-note { font-size: calc(var(--u) * 1.4); color: var(--ink-dim); margin-top: calc(var(--u) * 0.8); font-weight: 600; max-width: calc(var(--u) * 40); }

/* ---------- bottom controls ---------- */
.controls { position: absolute; left: 50%; bottom: calc(var(--u) * 2); transform: translateX(-50%); z-index: 6; display: flex; align-items: center; gap: calc(var(--u) * 1.2);
  padding: calc(var(--u) * 1.2) calc(var(--u) * 1.6); background: rgba(8, 16, 28, 0.86); border: 1px solid var(--line); border-radius: calc(var(--u) * 1.6);
  backdrop-filter: blur(8px); box-shadow: 0 12px 40px rgba(0,0,0,0.35); transition: opacity .3s, transform .3s; max-width: calc(100vw - var(--u) * 4); }
.ctl-group { display: flex; align-items: center; gap: calc(var(--u) * 0.8); }
.ctl-sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 calc(var(--u) * 0.4); }
.ctl-label { font-size: calc(var(--u) * 1.45); font-weight: 800; letter-spacing: 0.12em; color: var(--ink-dim); text-transform: uppercase; white-space: nowrap; }
.scene-controls { display: flex; align-items: center; gap: calc(var(--u) * 1.2); }
.scene-controls[hidden], .scene-panel[hidden], .scene-chain[hidden] { display: none !important; }

/* range sliders */
input[type=range] { -webkit-appearance: none; appearance: none; background: transparent; height: calc(var(--u) * 4.4); cursor: pointer; margin: 0; }
input[type=range]:focus { outline: none; }
input[type=range]::-webkit-slider-runnable-track { height: calc(var(--u) * 1.1); border-radius: 999px; background: var(--track, rgba(255,255,255,0.18)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: calc(var(--u) * 3.2); height: calc(var(--u) * 3.2); margin-top: calc(var(--u) * -1.05); border-radius: 50%;
  background: #fff; border: calc(var(--u) * 0.45) solid var(--thumb, var(--accent)); box-shadow: 0 2px 8px rgba(0,0,0,0.4); }
input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 5px rgba(74,163,255,0.4); }

/* ---------- projected labels ---------- */
.label-layer { position: absolute; inset: 0; pointer-events: none; }
.label3d { position: absolute; left: 0; top: 0; opacity: 0; transition: opacity .35s ease; will-change: transform, opacity; }
.label3d.shown { opacity: 1; }
.label-inner { display: flex; flex-direction: column; align-items: center; transform: translate(-50%, calc(-100% + var(--u) * 0.6)); }
.label3d.below .label-inner { flex-direction: column-reverse; transform: translate(-50%, calc(var(--u) * -0.6)); }
.label-box { background: rgba(8, 16, 28, 0.86); color: #fff; border: 1px solid rgba(255,255,255,0.22); border-radius: calc(var(--u) * 0.8); padding: calc(var(--u) * 0.55) calc(var(--u) * 1.2);
  text-align: center; white-space: nowrap; box-shadow: 0 4px 14px rgba(0,0,0,0.3); }
.label-text { font-size: calc(var(--u) * 2.0); font-weight: 800; letter-spacing: 0.03em; }
.label-sub { font-size: calc(var(--u) * 1.4); font-weight: 600; color: var(--ink-dim); margin-top: 1px; }
.label-stem { width: 2px; background: rgba(255,255,255,0.75); }
.label-dot { width: calc(var(--u) * 1.2); height: calc(var(--u) * 1.2); border-radius: 50%; background: #fff; border: 2px solid rgba(8,16,28,0.8); }
.kind-water .label-box { border-color: var(--water); background: rgba(5, 40, 56, 0.9); }
.kind-water .label-dot, .kind-water .label-stem { background: var(--water); }
.kind-pump .label-box { border-color: var(--pump); background: rgba(60, 38, 4, 0.9); }
.kind-pump .label-dot, .kind-pump .label-stem { background: var(--pump); }
.kind-warn .label-box { border-color: var(--warn); background: rgba(110, 14, 10, 0.94); }
.kind-warn .label-text { color: #fff; font-size: calc(var(--u) * 2.4); }
.kind-warn .label-dot, .kind-warn .label-stem { background: var(--warn); }
.kind-warn.shown .label-box { animation: warnpulse 1.4s ease-in-out infinite; }
@keyframes warnpulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,75,62,0.55); } 50% { box-shadow: 0 0 0 10px rgba(255,75,62,0); } }
.kind-green .label-box { border-color: var(--green); background: rgba(14, 50, 20, 0.9); }
.kind-green .label-dot, .kind-green .label-stem { background: var(--green); }
.kind-muted .label-box { background: rgba(8,16,28,0.7); }
.kind-muted .label-text { font-size: calc(var(--u) * 1.7); }

/* ---------- toast, loading, error ---------- */
.toast { position: absolute; left: 50%; top: calc(var(--u) * 8.4); transform: translate(-50%, -10px); background: var(--panel-solid); border: 1px solid var(--line); color: #fff;
  font-size: calc(var(--u) * 1.8); font-weight: 700; padding: calc(var(--u) * 1) calc(var(--u) * 2); border-radius: 999px; opacity: 0; transition: all .25s; pointer-events: none; z-index: 20; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.loading, .fatal { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at center, #13263e, #070e18); z-index: 50; transition: opacity .6s; }
.loading.done { opacity: 0; pointer-events: none; }
.loading-card, .fatal-card { width: min(80vw, calc(var(--u) * 70)); text-align: center; }
.loading-brand { font-weight: 800; letter-spacing: 0.12em; color: var(--accent); font-size: calc(var(--u) * 1.9); }
.loading-title { font-size: calc(var(--u) * 4); font-weight: 900; margin: calc(var(--u) * 1.6) 0 calc(var(--u) * 2.4); }
.loading-track { height: calc(var(--u) * 0.9); border-radius: 999px; background: rgba(255,255,255,0.12); overflow: hidden; }
.loading-bar { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--water)); transition: width .2s; }
.loading-step { margin-top: calc(var(--u) * 1.4); color: var(--ink-dim); font-size: calc(var(--u) * 1.8); font-weight: 600; }
.fatal-card h2 { font-size: calc(var(--u) * 3.6); margin: calc(var(--u) * 2) 0 calc(var(--u) * 1); }
.fatal-card p { font-size: calc(var(--u) * 2.1); line-height: 1.4; color: #dbe4ee; }

/* ---------- presentation & hidden-controls modes ---------- */
body.presenting .top-actions, body.presenting .scene-tabs { opacity: 0; pointer-events: none; }
body.presenting .topbar { background: linear-gradient(180deg, rgba(6,14,26,0.6), rgba(6,14,26,0)); border-bottom-color: transparent; }
body.presenting .controls { opacity: 0; transform: translate(-50%, 70%); }
body.presenting .controls.peek, body.presenting .controls:hover { opacity: 1; transform: translateX(-50%); }
body.controls-hidden .controls, body.controls-hidden .panel-host, body.controls-hidden .scene-tabs, body.controls-hidden .top-actions { opacity: 0 !important; pointer-events: none !important; }

/* ---------- scene specific widgets ---------- */
.year-readout { display: flex; flex-direction: column; align-items: center; min-width: calc(var(--u) * 11); }
.year-big { font-size: calc(var(--u) * 4.2); font-weight: 900; line-height: 1; letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
.year-phase { font-size: calc(var(--u) * 1.35); font-weight: 800; color: var(--ink-dim); letter-spacing: 0.1em; text-transform: uppercase; margin-top: calc(var(--u) * 0.4); white-space: nowrap; }
.timeline { display: flex; flex-direction: column; gap: calc(var(--u) * 0.3); width: calc(var(--u) * 52); }
.timeline input { width: 100%; --thumb: #ffd166; }
.tl-ticks { position: relative; height: calc(var(--u) * 2); font-size: calc(var(--u) * 1.4); color: var(--ink-dim); font-weight: 700; }
.tl-ticks span { position: absolute; transform: translateX(-50%); }
.pop-ref { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: calc(var(--u) * 0.5) calc(var(--u) * 1); border-radius: calc(var(--u) * 0.8);
  border: 1px solid var(--line); min-width: calc(var(--u) * 15); transition: all .3s; cursor: pointer; background: rgba(255,255,255,0.04); color: #fff; height: calc(var(--u) * 5.6); }
.pop-ref .pr-year { font-size: calc(var(--u) * 1.9); font-weight: 900; }
.pop-ref .pr-val { font-size: calc(var(--u) * 1.45); font-weight: 700; color: var(--ink-dim); white-space: nowrap; }
.pop-ref.active { background: rgba(255, 209, 102, 0.18); border-color: #ffd166; }
.pop-ref.active .pr-val { color: #ffe3a0; }
.preset-group .btn { padding: 0 calc(var(--u) * 1.2); font-size: calc(var(--u) * 1.6); }
.illustrative { font-size: calc(var(--u) * 1.3); color: var(--ink-dim); font-weight: 600; text-align: center; }
.big-stat { display: flex; align-items: center; gap: calc(var(--u) * 1.6); }
.big-stat .bs-from, .big-stat .bs-to { display: flex; flex-direction: column; }
.big-stat .bs-num { font-size: calc(var(--u) * 3.4); font-weight: 900; line-height: 1; }
.big-stat .bs-lab { font-size: calc(var(--u) * 1.45); font-weight: 700; color: var(--ink-dim); margin-top: calc(var(--u) * 0.4); }
.big-stat .bs-arrow { font-size: calc(var(--u) * 3.4); color: #ffd166; font-weight: 900; }
.goods-grid { display: flex; gap: calc(var(--u) * 0.6); margin: calc(var(--u) * 0.6) 0; }
.goods-grid i { width: calc(var(--u) * 2.6); height: calc(var(--u) * 2.6); border-radius: calc(var(--u) * 0.4); border: 2px solid rgba(255,255,255,0.4); }
.goods-grid i.on { background: #e8473a; border-color: #ff7d70; }
.fact-text { font-size: calc(var(--u) * 1.9); font-weight: 700; max-width: calc(var(--u) * 40); line-height: 1.3; }

/* groundwater widgets */
.extract-wrap { display: flex; align-items: center; gap: calc(var(--u) * 1.4); }
.extract-wrap .ctl-label { font-size: calc(var(--u) * 1.75); color: #fff; line-height: 1.15; }
.extract { display: flex; flex-direction: column; gap: 0; width: calc(var(--u) * 48); }
.extract input { width: 100%; --thumb: var(--pump); }
.extract-marks { position: relative; height: calc(var(--u) * 2.1); font-size: calc(var(--u) * 1.4); font-weight: 800; letter-spacing: 0.04em; }
.extract-marks .bal { position: absolute; left: 0; color: var(--green); white-space: nowrap; transform: translateX(calc(var(--u) * -1)); }
.extract-marks .bal::after { content: ""; position: absolute; left: calc(var(--u) * 1); bottom: calc(var(--u) * -0.9); width: 2px; height: calc(var(--u) * 1.1); background: var(--green); }
.extract-scale { position: relative; height: calc(var(--u) * 2); font-size: calc(var(--u) * 1.45); font-weight: 900; color: var(--ink-dim); letter-spacing: 0.1em; }
.extract-scale .lo { position: absolute; left: 0; }
.extract-scale .hi { position: absolute; right: 0; color: #ff9a6a; }
body[data-scene="groundwater"] .panel-host { left: calc(var(--u) * 2.4); right: auto; bottom: calc(var(--u) * 13.5); align-items: flex-start; }
body[data-scene="groundwater"] .panel { min-width: calc(var(--u) * 38); }
body[data-scene="groundwater"] .chain-step { font-size: calc(var(--u) * 1.75); }
body[data-scene="groundwater"] .chain { padding: calc(var(--u) * 1.1) calc(var(--u) * 1.3); }
.balance-row { display: grid; grid-template-columns: calc(var(--u) * 15) 1fr; align-items: center; gap: calc(var(--u) * 1); margin: calc(var(--u) * 0.6) 0; font-size: calc(var(--u) * 1.75); font-weight: 700; }
.bar-track { height: calc(var(--u) * 1.6); border-radius: 999px; background: rgba(255,255,255,0.1); overflow: hidden; width: calc(var(--u) * 20); }
.bar-fill { height: 100%; border-radius: 999px; transition: width .25s; }
.bar-fill.in { background: var(--green); }
.bar-fill.out { background: var(--pump); }
.store-state { margin-top: calc(var(--u) * 0.8); font-size: calc(var(--u) * 2.0); font-weight: 900; }
.store-state.falling { color: #ffc24d; }
.store-state.rising { color: #8fe596; }
.store-state.steady { color: #7fe3fb; }
.wt-depth { font-size: calc(var(--u) * 1.6); color: var(--ink-dim); font-weight: 700; margin-top: calc(var(--u) * 0.3); }
